name: Temporary NLLB MT probe

on:
  push:
    branches:
      - tmp/reverse-skill-export-20260826
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install translation runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            transformers sentencepiece torch

      - name: Translate representative security text with NLLB
        shell: bash
        run: |
          set -euo pipefail
          cat > probe.py <<'PY'
          import json
          import torch
          from transformers import AutoModelForSeq2SeqLM, AutoTokenizer

          model_id = 'facebook/nllb-200-distilled-600M'
          samples = [
              '中文用户默认中文；先结论后细节。',
              '本文件提供逆向工程、渗透测试、漏洞分析等安全类项目的文档模板。',
              '仅在授权范围内执行：先确认 scope 并保全样本、内存、进程树、网络连接和日志等证据，再隔离主机。',
              '报告正文中 MUST 含以下章节，可并入核心发现但字段不得省略。',
              '缺工具时调用 bootstrap，不要猜路径。',
          ]
          tokenizer = AutoTokenizer.from_pretrained(model_id, src_lang='zho_Hans')
          model = AutoModelForSeq2SeqLM.from_pretrained(model_id)
          model.eval()
          encoded = tokenizer(samples, return_tensors='pt', padding=True, truncation=True, max_length=512)
          with torch.inference_mode():
              generated = model.generate(
                  **encoded,
                  forced_bos_token_id=tokenizer.convert_tokens_to_ids('eng_Latn'),
                  num_beams=4,
                  max_new_tokens=256,
              )
          translations = tokenizer.batch_decode(generated, skip_special_tokens=True)
          output = [
              {'source': source, 'translation': translation}
              for source, translation in zip(samples, translations)
          ]
          with open('nllb-mt-probe.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          print(json.dumps(output, ensure_ascii=False, indent=2))
          PY
          python probe.py

      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: nllb-mt-probe
          path: nllb-mt-probe.json
          if-no-files-found: error
          retention-days: 1
