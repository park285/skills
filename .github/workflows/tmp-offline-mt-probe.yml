name: Temporary offline MT probe

on:
  push:
    branches:
      - tmp/reverse-skill-export-20260826
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install translation runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            ctranslate2 transformers sentencepiece sacremoses torch
          ct2-transformers-converter \
            --model Helsinki-NLP/opus-mt-zh-en \
            --output_dir opus-mt-zh-en-ct2 \
            --quantization int8

      - name: Translate representative security text
        shell: bash
        run: |
          set -euo pipefail
          cat > probe.py <<'PY'
          import json
          import ctranslate2
          from transformers import MarianTokenizer

          samples = [
              '中文用户默认中文；先结论后细节。',
              '本文件提供逆向工程、渗透测试、漏洞分析等安全类项目的文档模板。',
              '仅在授权范围内执行：先确认 scope 并保全样本、内存、进程树、网络连接和日志等证据，再隔离主机。',
              '报告正文中 MUST 含以下章节，可并入核心发现但字段不得省略。',
              '缺工具时调用 bootstrap，不要猜路径。',
          ]
          tokenizer = MarianTokenizer.from_pretrained('Helsinki-NLP/opus-mt-zh-en')
          translator = ctranslate2.Translator('opus-mt-zh-en-ct2', device='cpu', compute_type='int8')
          source = [tokenizer.convert_ids_to_tokens(tokenizer.encode(text)) for text in samples]
          results = translator.translate_batch(source, beam_size=4, max_decoding_length=256)
          output = []
          for original, result in zip(samples, results):
              ids = tokenizer.convert_tokens_to_ids(result.hypotheses[0])
              translated = tokenizer.decode(ids, skip_special_tokens=True)
              output.append({'source': original, 'translation': translated})
          with open('offline-mt-probe.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          print(json.dumps(output, ensure_ascii=False, indent=2))
          PY
          python probe.py

      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: offline-mt-probe
          path: offline-mt-probe.json
          if-no-files-found: error
          retention-days: 1
