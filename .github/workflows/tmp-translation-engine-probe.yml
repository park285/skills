name: Temporary translation engine probe

on:
  push:
    branches:
      - tmp/reverse-skill-export-20260826
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe GitHub Models and Google Translate fallback
        env:
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          result = {}
          token = os.environ.get('GH_MODELS_TOKEN', '')
          payload = {
              'model': 'openai/gpt-4.1-mini',
              'messages': [
                  {'role': 'system', 'content': 'Translate Chinese to concise technical English. Return only the translation.'},
                  {'role': 'user', 'content': '中文用户默认中文；先结论后细节。'},
              ],
              'temperature': 0,
              'max_tokens': 100,
          }
          req = urllib.request.Request(
              'https://models.github.ai/inference/chat/completions',
              data=json.dumps(payload).encode('utf-8'),
              headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = json.load(response)
              result['github_models'] = {'ok': True, 'text': data['choices'][0]['message']['content']}
          except Exception as exc:
              result['github_models'] = {'ok': False, 'error': f'{type(exc).__name__}: {exc}'}

          params = urllib.parse.urlencode({
              'client': 'gtx', 'sl': 'zh-CN', 'tl': 'en', 'dt': 't',
              'q': '中文用户默认中文；先结论后细节。',
          })
          try:
              with urllib.request.urlopen('https://translate.googleapis.com/translate_a/single?' + params, timeout=60) as response:
                  data = json.load(response)
              text = ''.join(part[0] for part in data[0] if part and part[0])
              result['google_translate'] = {'ok': True, 'text': text}
          except Exception as exc:
              result['google_translate'] = {'ok': False, 'error': f'{type(exc).__name__}: {exc}'}

          with open('translation-engine-probe.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: translation-engine-probe
          path: translation-engine-probe.json
          if-no-files-found: error
          retention-days: 1
